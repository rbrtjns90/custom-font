<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mankup Text Demo</title>
  <style>
    body { background:#111; padding:40px 20px; display:flex; flex-direction:column; align-items:center; gap:28px; }
    p { color:#555; font:11px/1 sans-serif; margin:0 0 6px; text-align:center; }
    mankup-text { display:inline-block; line-height:1; }
  </style>
</head>
<body>
  <p>Uppercase</p>
  <mankup-text scale="0.6" text="ABCDEFGHIJKLMNOPQRSTUVWXYZ"></mankup-text>

  <p>Lowercase</p>
  <mankup-text scale="0.6" text="abcdefghijklmnopqrstuvwxyz"></mankup-text>

  <p>Digits</p>
  <mankup-text scale="0.6" text="0123456789"></mankup-text>

  <p>Symbols</p>
  <mankup-text scale="0.6" text="!?@#$%^&amp;*()_+-="></mankup-text>

  <p>Hello World</p>
  <mankup-text scale="0.9" text="Hello, World!"></mankup-text>
  <mankup-text scale="0.9" text="Just checking, to make sure this renders correctly. Does it work? 1231313313132421"></mankup-text>

  <script src="mankup-text.js"></script>
</body>
</html>
